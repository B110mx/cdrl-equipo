services:
  # Base de Datos Relacional Base
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdrl_dev_only}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-cdrl_migrator_user}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-migrator_local_only}
      POSTGRES_WRITER_USER: ${POSTGRES_WRITER_USER:-cdrl_writer_user}
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD:-writer_local_only}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-cdrl_reader_user}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-reader_local_only}
      POSTGRES_OPERATOR_USER: ${POSTGRES_OPERATOR_USER:-cdrl_operator_user}
      POSTGRES_OPERATOR_PASSWORD: ${POSTGRES_OPERATOR_PASSWORD:-operator_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Document / NoSQL Store (DynamoDB Local)
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  # Document Store (MongoDB)
  mongodb:
    image: mongo:7.0
    container_name: cdrl_mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  # Graph Store (Neo4j)
  neo4j:
    image: neo4j:5.15
    container_name: cdrl_neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
    ports:
      - "${NEO4J_PORT:-7687}:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data

  # Column Store (Cassandra)
  cassandra:
    image: cassandra:4.1
    container_name: cdrl_cassandra
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  # Object Store (S3 Compatible via LocalStack)
  minio:
    image: localstack/localstack:3.0
    container_name: cdrl_minio
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "${MINIO_PORT:-9000}:4566"

volumes:
  postgres_data:
  dynamodb_data:
  mongodb_data:
  neo4j_data:
  cassandra_data:
  minio_data: