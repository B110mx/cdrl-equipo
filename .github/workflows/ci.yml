name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup
          make verify
          make run

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdrl-verification-evidence
          path: |
            artifacts/*.json
            artifacts/make-verify-output.txt
            evidence/*.json
          if-no-files-found: error