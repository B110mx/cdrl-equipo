name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup
          make verify
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-verification
          path: |
            artifacts/m01-verify.json
            artifacts/make-verify-output.txt
          if-no-files-found: warn
